name: Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # basic = GitHub Actions cache, работает и в приватных/форковых PR
          cache-provider: basic
          cache-read-only: false
          validate-wrappers: true

      - name: Ensure local.properties (SDK path)
        run: |
          if [ ! -f local.properties ]; then
            echo "sdk.dir=${ANDROID_HOME}" > local.properties
          fi
          cat local.properties

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify config.json is embedded in APK
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/config.json > /tmp/apk-config.json
          diff -u ../config.json /tmp/apk-config.json
          echo "assets/config.json совпадает с корневым config.json"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: net-availability-monitor-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Attach APK to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: net-availability-monitor-android-debug
          path: dist

      - name: Rename APK with version
        run: |
          cd dist
          mv app-debug.apk "net-availability-monitor-android-${GITHUB_REF_NAME}.apk"
          ls -l

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
