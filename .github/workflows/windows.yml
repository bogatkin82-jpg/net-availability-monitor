name: Windows build

# Сборка Windows-артефактов:
#   * push/PR  — NetMonitor.exe (PyInstaller), тесты, selftest, smoke;
#   * тег v*   — подписанный exe + Inno Setup установщик, публикация Release;
#   * nightly  — то же, но в prerelease-релиз с тегом `nightly`.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   WINDOWS_PFX_BASE64    — base64 от .pfx с приватным ключом code-signing;
#   WINDOWS_PFX_PASSWORD  — пароль .pfx.
# Без секретов exe/установщик собираются неподписанными (push/PR).

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "server.py"
      - "tray.py"
      - "windows/**"
      - "config.json"
      - "static/**"
      - "docs/windows.md"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "server.py"
      - "tray.py"
      - "windows/**"
      - "config.json"
      - "static/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Опубликовать как nightly"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NetMonitor.exe
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pystray pillow

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Syntax check
        run: python -m py_compile server.py tray.py windows/entry.py

      - name: Unit tests (Windows layer)
        run: python windows/tests/test_windows.py

      - name: Generate icon
        run: python windows/make_icon.py

      - name: Build NetMonitor.exe
        run: python -m PyInstaller --noconfirm --clean --log-level=WARN windows/netmon.spec

      - name: Selftest exe (no GUI, no network)
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\NetMonitor.exe" -ArgumentList "--selftest" -Wait -PassThru
          $logPath = Join-Path $env:LOCALAPPDATA "net-availability-monitor\logs\netmon.log"
          if (Test-Path $logPath) { Get-Content -Path $logPath -Tail 120 }
          Write-Host "selftest exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) {
            throw "NetMonitor.exe --selftest завершился с кодом $($process.ExitCode)"
          }

      - name: Server smoke test (exe --server-only)
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "netmon-ci-data"
          $process = Start-Process -FilePath "dist\NetMonitor.exe" -ArgumentList @(
            "--server-only", "--port", "18099", "--interval", "60", "--data-dir", $dataDir
          ) -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18099/api/health" -TimeoutSec 2
                if ($health.ok) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw "сервер не ответил на /api/health за 30 с" }

            $state = Invoke-RestMethod -Uri "http://127.0.0.1:18099/api/state" -TimeoutSec 15
            Write-Host "poll_interval=$($state.poll_interval) services=$($state.services.Count) overall=$($state.summary.overall)"
            if ($state.poll_interval -ne 60) { throw "CLI --interval не применился: $($state.poll_interval)" }
            if ($state.services.Count -lt 1) { throw "в /api/state нет сервисов" }

            $page = Invoke-WebRequest -Uri "http://127.0.0.1:18099/" -TimeoutSec 10 -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "Мониторинг доступности") {
              throw "дашборд не отдаётся из статики внутри exe"
            }
            Write-Host "smoke test: OK"
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 500
          }

      - name: Stop leftover NetMonitor processes (PyInstaller child)
        shell: pwsh
        run: |
          Get-Process -Name NetMonitor -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $left = Get-Process -Name NetMonitor -ErrorAction SilentlyContinue
          if ($left) { $left | Stop-Process -Force; Start-Sleep -Seconds 1 }

      - name: Determine release channel
        id: channel
        shell: pwsh
        run: |
          $tag = ""
          $release = "false"
          $prerelease = "false"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME; $release = "true"
          } elseif ($env:GITHUB_EVENT_NAME -eq "schedule" -or "${{ inputs.nightly }}" -eq "true") {
            $tag = "nightly"; $release = "true"; $prerelease = "true"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Sign NetMonitor.exe
        if: steps.channel.outputs.release == 'true'
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_PFX_BASE64) { throw "секрет WINDOWS_PFX_BASE64 не задан" }
          $pfx = Join-Path $env:RUNNER_TEMP "netmon.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $secure = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          $result = Set-AuthenticodeSignature -FilePath "dist\NetMonitor.exe" -Certificate $cert
          if (-not $result.SignerCertificate) { throw "не удалось подписать NetMonitor.exe" }
          Write-Host "signed: $($result.Status) $($result.SignerCertificate.Subject)"
          Get-AuthenticodeSignature "dist\NetMonitor.exe" | Format-List Status, SignerCertificate

      - name: Build Inno Setup installer
        if: steps.channel.outputs.release == 'true'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден: $iscc" }
          $ver = "1.1.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $ver = $env:GITHUB_REF_NAME.Substring(1) }
          & $iscc "/DMyAppVersion=$ver" "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с кодом $LASTEXITCODE" }

      - name: Sign installer
        if: steps.channel.outputs.release == 'true'
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_PFX_BASE64) { throw "секрет WINDOWS_PFX_BASE64 не задан" }
          $setup = "dist\NetMonitor-Setup-x64.exe"
          if (-not (Test-Path $setup)) { throw "установщик не найден: $setup" }
          $pfx = Join-Path $env:RUNNER_TEMP "netmon.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $secure = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          $result = Set-AuthenticodeSignature -FilePath $setup -Certificate $cert
          if (-not $result.SignerCertificate) { throw "не удалось подписать установщик" }
          Write-Host "signed setup: $($result.Status)"
          Get-AuthenticodeSignature $setup | Format-List Status, SignerCertificate

      - name: Package release artifacts
        if: steps.channel.outputs.release == 'true'
        shell: pwsh
        run: |
          $stage = "dist\NetMonitor-windows-x64"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "dist\NetMonitor.exe" $stage
          Copy-Item "config.json" (Join-Path $stage "config.json.example")
          Copy-Item "docs\windows.md" (Join-Path $stage "README.md")
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "dist\NetMonitor-windows-x64.zip" -Force
          Copy-Item "windows\netmon-code-signing.cer" "dist\netmon-code-signing.cer"
          $files = @("dist\NetMonitor-windows-x64.zip", "dist\NetMonitor-Setup-x64.exe", "dist\NetMonitor.exe")
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content -Encoding ascii "dist\SHA256SUMS.txt"
          Get-Content "dist\SHA256SUMS.txt"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload build artifact (push/PR)
        if: steps.channel.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NetMonitor-windows-x64
          path: dist/NetMonitor-windows-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release artifacts
        if: steps.channel.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NetMonitor-windows-release
          path: |
            dist/NetMonitor-windows-x64.zip
            dist/NetMonitor-Setup-x64.exe
            dist/netmon-code-signing.cer
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tag or nightly)
        if: steps.channel.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.channel.outputs.tag }}
          name: ${{ steps.channel.outputs.tag == 'nightly' && 'Nightly build' || steps.channel.outputs.tag }}
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/NetMonitor-windows-x64.zip
            dist/NetMonitor-Setup-x64.exe
            dist/netmon-code-signing.cer
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
